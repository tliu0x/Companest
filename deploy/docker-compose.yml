services:
  companest:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - companest-control:/var/lib/companest
      - ${COMPANEST_STATE_MOUNT:?Mount persistent business state}:/mnt/companest/state
      - ${COMPANEST_WORKSPACE_MOUNT:?Mount persistent workspaces}:/mnt/companest/workspaces
      - ${COMPANEST_LOCK_MOUNT:?Mount shared locks}:/mnt/companest/locks
      - ${COMPANEST_CONFIG:?Set control config path}:/etc/companest/config.md:ro
      - ${SUBSTRATE_KUBECONFIG:?Set scoped kubeconfig path}:/etc/companest/substrate-kubeconfig:ro
    environment:
      - COMPANEST_API_TOKEN
      - COMPANEST_MASTER_TOKEN
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_DEFAULT_REGION
      - COMPANEST_S3_BUCKET
    healthcheck:
      test: python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  companest-control:
